name: Release Native Android

on:
  workflow_dispatch:
    inputs:
      project:
        description: '原生 Android 项目'
        type: choice
        required: true
        default: tinglan
        options: [tinglan]
      source_sha:
        description: '所选项目 main 分支的完整提交 SHA'
        required: true
        type: string
      upload_internal:
        description: Upload to Google Play internal testing after the initial manual upload
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-android-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: native-android-${{ inputs.project }}
    env:
      NATIVE_ANDROID_PROJECT: ${{ inputs.project }}
      TARGET_APP_DIR: ${{ github.workspace }}/${{ inputs.project }}-android
      VERSION_CODE: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Checkout the requested source commit
        env:
          TARGET_REPO: ${{ secrets[format('{0}_ANDROID_REPO', inputs.project)] }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: ruby -r ./fastlane/lib/native_android_release -e 'NativeAndroidRelease.checkout!'

      - name: Read the app release configuration
        id: config
        run: ruby -r ./fastlane/lib/native_android_release -e 'NativeAndroidRelease.describe!'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.config.outputs.java_version }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        env:
          SDK_PLATFORM: ${{ steps.config.outputs.sdk_platform }}
          BUILD_TOOLS: ${{ steps.config.outputs.build_tools }}
        run: sdkmanager "platforms;$SDK_PLATFORM" "build-tools;$BUILD_TOOLS"

      - name: Validate the project source catalog
        if: steps.config.outputs.catalog_check != ''
        env:
          CATALOG_CHECK: ${{ steps.config.outputs.catalog_check }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 "$CATALOG_CHECK"

      - name: Run unit tests and Android lint
        working-directory: ${{ steps.config.outputs.project }}
        env:
          MODULE: ${{ steps.config.outputs.module }}
        run: ./gradlew "$MODULE:testDebugUnitTest" "$MODULE:lintRelease"

      - name: Build the signed Android App Bundle
        working-directory: ${{ steps.config.outputs.project }}
        env:
          MODULE: ${{ steps.config.outputs.module }}
          VERSION_CODE_PROPERTY: ${{ steps.config.outputs.version_code_property }}
        run: ./gradlew "$MODULE:bundleRelease" "-P$VERSION_CODE_PROPERTY=$VERSION_CODE"

      - name: Verify and record the release artifact
        env:
          AAB: ${{ steps.config.outputs.bundle }}
          PACKAGE_NAME: ${{ steps.config.outputs.package_name }}
          BUNDLE_CHECK: ${{ steps.config.outputs.bundle_check }}
        run: |
          set -euo pipefail
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify "$AAB" | grep -F 'jar verified.'
          if [[ -n "$BUNDLE_CHECK" ]]; then
            python3 "$BUNDLE_CHECK" "$AAB"
          fi
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB"
          manifest_value() {
            java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --xpath="$1"
          }
          test "$(manifest_value /manifest/@package)" = "$PACKAGE_NAME"
          test "$(manifest_value /manifest/@android:versionCode)" = "$VERSION_CODE"
          revision="$(git -C "$TARGET_APP_DIR" rev-parse HEAD)"
          {
            printf 'Package: %s\nVersion: %s (%s)\nCommit: %s\n' "$PACKAGE_NAME" \
              "$(manifest_value /manifest/@android:versionName)" "$VERSION_CODE" "$revision"
            printf 'AAB bytes: %s\n' "$(wc -c < "$AAB" | tr -d ' ')"
            printf 'AAB SHA-256: %s\n' "$(sha256sum "$AAB" | cut -d' ' -f1)"
          } | tee "$RUNNER_TEMP/native-android-release.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-aab-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.config.outputs.bundle }}
            ${{ steps.config.outputs.mapping }}
            ${{ runner.temp }}/native-android-release.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play internal testing
        if: inputs.upload_internal
        env:
          PLAY_KEY_JSON: ${{ secrets[format('{0}_PLAY_SERVICE_ACCOUNT_JSON', inputs.project)] }}
        run: |
          set -euo pipefail
          : "${PLAY_KEY_JSON:?Configure the Play service account secret for the selected project}"
          umask 077
          export NATIVE_ANDROID_PLAY_KEY_FILE="$(mktemp "$RUNNER_TEMP/native-android-play.XXXXXX")"
          trap 'rm -f "$NATIVE_ANDROID_PLAY_KEY_FILE"' EXIT
          printf '%s' "$PLAY_KEY_JSON" > "$NATIVE_ANDROID_PLAY_KEY_FILE"
          unset PLAY_KEY_JSON
          bundle exec fastlane android upload_native_aab
