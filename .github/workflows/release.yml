name: release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        type: choice
        options: [请选择, PW, LJ, DNT, LMT, HT, SP, CY]
      branch:
        description: '构建分支'
        required: true
        default: 'main'
        type: string
      flavor:
        description: '构建环境'
        required: true
        default: 'production'
        type: choice
        options: [production, beta]
      bump_build:
        description: '是否自动增加 build 号'
        required: true
        type: boolean
        default: true
      upload_testflight:
        description: '是否打包 iOS 上传到 TestFlight'
        required: true
        type: boolean
        default: true
      external_testing:
        description: '是否自动分发到外部测试'
        required: true
        type: boolean
        default: true
      testflight_changelog:
        description: 'TestFlight 测试说明'
        required: true
        type: string
        default: '版本更新'
      upload_macos_testflight:
        description: '是否打包 macOS 上传到 TestFlight'
        required: true
        type: boolean
        default: false
      upload_pgyer:
        description: '是否打包 Android'
        required: true
        type: boolean
        default: true
      is_overseas:
        description: '是否海外'
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: CI Build
    runs-on: macos-15
    env:
      RELEASE_TOOLS_DIR: ${{ github.workspace }}/release-tools
      TARGET_APP_DIR: ${{ github.workspace }}/target-app
      RELEASE_CONFIG_PATH: ${{ github.workspace }}/target-app/.github/release.yml
      SELECTED_ENVIRONMENT: ${{ github.event.inputs.environment }}
      BUILD_BRANCH: ${{ github.event.inputs.branch }}
      BUILD_FLAVOR: ${{ github.event.inputs.flavor }}
      EXTERNAL_TESTING: ${{ github.event.inputs.external_testing }}
      IS_OVERSEAS: ${{ github.event.inputs.is_overseas }}
      PW_REPO: ${{ secrets.PW }}
      LJ_REPO: ${{ secrets.LJ }}
      DNT_REPO: ${{ secrets.DNT }}
      LMT_REPO: ${{ secrets.LMT }}
      HT_REPO: ${{ secrets.HT }}
      SP_REPO: ${{ secrets.SP }}
      CY_REPO: ${{ secrets.CY }}

    steps:
      - name: Validate environment input
        run: |
          if [ "$SELECTED_ENVIRONMENT" = "请选择" ]; then
            echo "Please select a valid environment (not 请选择)."
            exit 1
          fi

      - name: Select target repository
        run: |
          case "$SELECTED_ENVIRONMENT" in
            PW)  REPO="$PW_REPO" ;;
            LJ)  REPO="$LJ_REPO" ;;
            DNT) REPO="$DNT_REPO" ;;
            LMT) REPO="$LMT_REPO" ;;
            HT)  REPO="$HT_REPO" ;;
            SP)  REPO="$SP_REPO" ;;
            CY)  REPO="$CY_REPO" ;;
          esac
          if [ -z "$REPO" ]; then
            echo "Repository secret is empty for $SELECTED_ENVIRONMENT"
            exit 1
          fi
          echo "REPO=$REPO" >> "$GITHUB_ENV"

      - name: Checkout centralized release tools
        uses: actions/checkout@v4
        with:
          path: release-tools

      - name: List available Xcode versions
        run: ls -1 /Applications | grep -E '^Xcode.*\.app$' || true

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: release-tools

      - name: Setup SSH
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan codeup.aliyun.com github.com >> "$HOME/.ssh/known_hosts"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone target repository
        run: git clone --recursive --branch "$BUILD_BRANCH" "$REPO" "$TARGET_APP_DIR"

      - name: Detect centralized release configuration
        id: release_mode
        run: |
          if [ -f "$RELEASE_CONFIG_PATH" ]; then
            echo "centralized=true" >> "$GITHUB_OUTPUT"
            echo "Using centralized release lanes"
          else
            echo "centralized=false" >> "$GITHUB_OUTPUT"
            echo "Release configuration not found; using legacy project lanes during migration"
          fi

      - name: Validate centralized release configuration
        if: ${{ steps.release_mode.outputs.centralized == 'true' }}
        working-directory: ${{ env.RELEASE_TOOLS_DIR }}
        run: |
          bundle exec fastlane validate_config \
            project_root:"$TARGET_APP_DIR" \
            config_path:"$RELEASE_CONFIG_PATH" \
            external_testing:"$EXTERNAL_TESTING" \
            changelog:"$TESTFLIGHT_CHANGELOG"
        env:
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.testflight_changelog }}

      - name: Bump build number and push
        if: ${{ github.event.inputs.bump_build == 'true' }}
        working-directory: ${{ env.TARGET_APP_DIR }}
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1 | awk '{print $2}')
          OLD_BUILD=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          OLD_BUILD=${OLD_BUILD:-0}
          TODAY=$(date +%Y%m%d)
          OLD_DATE=${OLD_BUILD:0:8}
          OLD_COUNT=${OLD_BUILD:8:1}
          OLD_COUNT=${OLD_COUNT:-0}

          if [ "$OLD_DATE" = "$TODAY" ]; then
            NEW_COUNT=$((OLD_COUNT + 1))
          else
            NEW_COUNT=0
          fi

          NEW_BUILD_NUM="${TODAY}${NEW_COUNT}"
          echo "Current version: $VERSION_NAME+$OLD_BUILD"
          echo "New build number: $NEW_BUILD_NUM"
          sed -i "" "s/^version:.*/version: $VERSION_NAME+$NEW_BUILD_NUM/" pubspec.yaml
          echo "NEW_BUILD_NUM=$NEW_BUILD_NUM" >> "$GITHUB_ENV"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pubspec.yaml
          git commit -m "release: $VERSION_NAME+$NEW_BUILD_NUM" || echo "No changes to commit"
          git push

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: target-app/pubspec.yaml

      - name: Show Flutter version
        run: flutter --version

      - name: Install FlutterFire CLI
        if: ${{ github.event.inputs.is_overseas == 'true' }}
        run: |
          dart pub global activate flutterfire_cli
          echo "PATH=$HOME/.pub-cache/bin:$PATH" >> "$GITHUB_ENV"

      - name: Verify FlutterFire
        if: ${{ github.event.inputs.is_overseas == 'true' }}
        run: flutterfire --version

      - name: Set launcher icon
        working-directory: ${{ env.TARGET_APP_DIR }}
        run: |
          if [ "$BUILD_FLAVOR" = "beta" ]; then
            echo "⚙️ 切换为 Beta 图标"
            yq -i '
              .flutter_launcher_icons.image_path = "icons/icon_beta.png" |
              .flutter_launcher_icons.adaptive_icon_foreground = "icons/icon_beta.png"
            ' pubspec.yaml
          else
            echo "⚙️ 使用正式版图标"
            yq -i '
              .flutter_launcher_icons.image_path = "icons/icon.png" |
              .flutter_launcher_icons.adaptive_icon_foreground = "icons/icon.png"
            ' pubspec.yaml
          fi

      - name: Generate launcher icons
        working-directory: ${{ env.TARGET_APP_DIR }}
        run: dart run flutter_launcher_icons
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

      - name: Build IPA and upload TestFlight
        if: ${{ github.event.inputs.upload_testflight == 'true' && steps.release_mode.outputs.centralized == 'true' }}
        working-directory: ${{ env.RELEASE_TOOLS_DIR }}
        run: |
          bundle exec fastlane ios release_beta \
            project_root:"$TARGET_APP_DIR" \
            config_path:"$RELEASE_CONFIG_PATH" \
            flavor:"$BUILD_FLAVOR" \
            external_testing:"$EXTERNAL_TESTING" \
            changelog:"$TESTFLIGHT_CHANGELOG"
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.testflight_changelog }}

      - name: Build IPA with legacy project lane
        if: ${{ github.event.inputs.upload_testflight == 'true' && steps.release_mode.outputs.centralized != 'true' }}
        working-directory: ${{ env.TARGET_APP_DIR }}/ios
        run: |
          fastlane ios release_beta \
            flavor:"$BUILD_FLAVOR" \
            external_testing:"$EXTERNAL_TESTING" \
            changelog:"$TESTFLIGHT_CHANGELOG"
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.testflight_changelog }}

      - name: Build APK and upload Pgyer
        if: ${{ github.event.inputs.upload_pgyer == 'true' && steps.release_mode.outputs.centralized == 'true' }}
        working-directory: ${{ env.RELEASE_TOOLS_DIR }}
        run: |
          bundle exec fastlane android release_beta \
            project_root:"$TARGET_APP_DIR" \
            config_path:"$RELEASE_CONFIG_PATH" \
            flavor:"$BUILD_FLAVOR" \
            is_overseas:"$IS_OVERSEAS"
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}

      - name: Build APK with legacy project lane
        if: ${{ github.event.inputs.upload_pgyer == 'true' && steps.release_mode.outputs.centralized != 'true' }}
        working-directory: ${{ env.TARGET_APP_DIR }}/android
        run: fastlane android release_beta flavor:"$BUILD_FLAVOR" is_overseas:"$IS_OVERSEAS"
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}

      - name: Build AAB and upload Google Play
        if: ${{ github.event.inputs.is_overseas == 'true' && steps.release_mode.outputs.centralized == 'true' }}
        working-directory: ${{ env.RELEASE_TOOLS_DIR }}
        run: |
          bundle exec fastlane android release_aab \
            project_root:"$TARGET_APP_DIR" \
            config_path:"$RELEASE_CONFIG_PATH" \
            flavor:"$BUILD_FLAVOR" \
            is_overseas:true
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

      - name: Build AAB with legacy project lane
        if: ${{ github.event.inputs.is_overseas == 'true' && steps.release_mode.outputs.centralized != 'true' }}
        working-directory: ${{ env.TARGET_APP_DIR }}/android
        run: fastlane android release_aab flavor:"$BUILD_FLAVOR" is_overseas:true
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

      - name: Build macOS and upload TestFlight
        if: ${{ github.event.inputs.upload_macos_testflight == 'true' }}
        working-directory: ${{ env.TARGET_APP_DIR }}/macos
        run: fastlane mac release_beta flavor:"$BUILD_FLAVOR"
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Notify Feishu
        if: always() && !cancelled() && steps.release_mode.outputs.centralized == 'true'
        working-directory: ${{ env.RELEASE_TOOLS_DIR }}
        run: |
          bundle exec fastlane notify_feishu \
            project_root:"$TARGET_APP_DIR" \
            config_path:"$RELEASE_CONFIG_PATH" \
            flavor:"$BUILD_FLAVOR" \
            branch:"$BUILD_BRANCH"
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Notify Feishu with legacy project lane
        if: always() && !cancelled() && steps.release_mode.outputs.centralized != 'true'
        working-directory: ${{ env.TARGET_APP_DIR }}
        run: |
          if [ ! -f fastlane/Fastfile ]; then
            echo "Legacy notification lane not found; skipping"
            exit 0
          fi
          cd fastlane
          fastlane notify_fei_shu flavor:"$BUILD_FLAVOR" branch:"$BUILD_BRANCH"
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_ACTOR: ${{ github.actor }}
