name: release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        type: choice
        options:
          - PW
          - LJ
          - DNT
          - LMT
          - HT
          - SP
      branch:
        description: "构建分支"
        required: true
        default: "main"
        type: string
      flavor:
        description: "构建环境"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - beta
      bump_build:
        description: '是否自动增加 build 号'
        required: true
        type: boolean
        default: true
      upload_testflight:
        description: '是否打包 iOS 上传到 TestFlight'
        required: true
        type: boolean
        default: true
      upload_macos_testflight:
        description: '是否打包 macOS 上传到 TestFlight'
        required: true
        type: boolean
        default: false
      upload_pgyer:
        description: '是否打包 Android'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: CI Build
    runs-on: macos-15

    steps:
      # 设置 git 地址和 WORKDIR
      - name: Select Work Directory
        run: |
          case "${{ github.event.inputs.environment }}" in
            PW)  REPO="${{ secrets.PW }}" ;;
            LJ)  REPO="${{ secrets.LJ }}" ;;
            DNT) REPO="${{ secrets.DNT }}" ;;
            LMT) REPO="${{ secrets.LMT }}" ;;
            HT)  REPO="${{ secrets.HT }}" ;;
            SP)  REPO="${{ secrets.SP }}" ;;
          esac
          
          echo "REPO=$REPO" >> $GITHUB_ENV
          
          # 取仓库名 (去掉 .git 后缀)
          WORKDIR=$(basename -s .git "$REPO")
          echo "WORKDIR=$WORKDIR" >> $GITHUB_ENV

      - name: Select Xcode version
        run: "sudo xcode-select --switch /Applications/Xcode_16.3.app/Contents/Developer"

      # 设置SSH KEY
      - name: Setup SSH
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan codeup.aliyun.com >> "$HOME/.ssh/known_hosts"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # Clone Repo
      - name: Clone target repo
        run: git clone --recursive "$REPO" -b ${{ github.event.inputs.branch }}

      # 版本号自动+1
      - name: Bump build number & push
        if: ${{ github.event.inputs.bump_build == 'true' }}
        run: |
          cd $WORKDIR
          
          # 读取 pubspec.yaml version
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1 | awk '{print $2}')
          OLD_BUILD=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          OLD_BUILD=${OLD_BUILD:-0}

          # 获取今天日期 (yyyyMMdd)
          TODAY=$(date +%Y%m%d)

          # 提取旧 build 号的日期部分和计数部分
          OLD_DATE=${OLD_BUILD:0:8}
          OLD_COUNT=${OLD_BUILD:8:1}
          OLD_COUNT=${OLD_COUNT:-0}

          if [ "$OLD_DATE" = "$TODAY" ]; then
            # 如果是今天，计数+1
            NEW_COUNT=$((OLD_COUNT + 1))
          else
            # 如果不是今天，重置为0
            NEW_COUNT=0
          fi

          NEW_BUILD_NUM="${TODAY}${NEW_COUNT}"

          echo "Current version: $VERSION_NAME+$OLD_BUILD"
          echo "New build number: $NEW_BUILD_NUM"
          
          # 替换 pubspec.yaml
          # 兼容 macOS 和 Linux 的 sed
          if [ "${{ runner.os }}" = "macOS" ]; then
            sed -i "" "s/^version:.*/version: $VERSION_NAME+$NEW_BUILD_NUM/" pubspec.yaml
          else
            sed -i "s/^version:.*/version: $VERSION_NAME+$NEW_BUILD_NUM/" pubspec.yaml
          fi
          echo "NEW_BUILD_NUM=$NEW_BUILD_NUM" >> $GITHUB_ENV
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pubspec.yaml
          git commit -m "release: $VERSION_NAME+$NEW_BUILD_NUM" || echo "No changes to commit"
          git push

      # 安装Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ${{ env.WORKDIR }}/pubspec.yaml
      - run: flutter --version

      # 动态修改 pubspec.yaml 的 icon 路径
      - name: Set launcher icon
        run: |
          cd $WORKDIR
          if [ "${{ github.event.inputs.flavor }}" = "beta" ]; then
            echo "⚙️ 切换为 Beta 图标"
            yq -i '
              .flutter_launcher_icons.image_path = "icons/icon_beta.png" |
              .flutter_launcher_icons.adaptive_icon_foreground = "icons/icon_beta.png"
            ' pubspec.yaml
          else
            echo "⚙️ 使用正式版图标"
            yq -i '
              .flutter_launcher_icons.image_path = "icons/icon.png" |
              .flutter_launcher_icons.adaptive_icon_foreground = "icons/icon.png"
            ' pubspec.yaml
          fi

      - name: Generate launcher icons
        run: |
          cd $WORKDIR
          dart run flutter_launcher_icons
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

      # 打包iOS
      - name: Building IPA
        if: ${{ github.event.inputs.upload_testflight == 'true' }}
        run: |
          cd $WORKDIR/ios
          fastlane ios release_beta flavor:${{ github.event.inputs.flavor }}
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      # 打包android
      - name: Building APK
        if: ${{ github.event.inputs.upload_pgyer == 'true' }}
        run: |
          cd $WORKDIR/android
          fastlane android release_beta flavor:${{ github.event.inputs.flavor }}
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}

      # 打包macOS
      - name: Building macOS
        if: ${{ github.event.inputs.upload_macos_testflight == 'true' }}
        run: |
          cd $WORKDIR/macos
          fastlane macos release_beta flavor:${{ github.event.inputs.flavor }}
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      # 飞书机器人通知
      - name: Notify FeiShu
        if: always() && !cancelled()  # 排除取消状态
        run: |
          cd $WORKDIR/fastlane
          fastlane notify_fei_shu flavor:${{ github.event.inputs.flavor }} branch:${{ github.event.inputs.branch }}
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}